<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Cleanup - GLEO</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }
        h1 {
            color: #1e293b;
            margin-bottom: 10px;
            font-size: 2rem;
        }
        p {
            color: #64748b;
            margin-bottom: 30px;
        }
        .btn {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: white;
            border: none;
            padding: 16px 32px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
        }
        .btn:active {
            transform: scale(0.98);
        }
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .result {
            margin-top: 20px;
            padding: 16px;
            border-radius: 12px;
            font-weight: 500;
            display: none;
        }
        .result.success {
            background: #d1fae5;
            color: #065f46;
            display: block;
        }
        .result.error {
            background: #fee2e2;
            color: #dc2626;
            display: block;
        }
        .warning {
            background: #fef3c7;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            color: #92400e;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🗑️ Orders Cleanup</h1>
        <p>Delete all orders from the database</p>
        
        <div class="warning">
             Warning: This action cannot be undone!
        </div>
        
        <button class="btn" onclick="cleanupOrders()">Delete All Orders</button>
        
        <div class="result" id="result"></div>
    </div>

    <script>
        async function cleanupOrders() {
            const btn = document.querySelector('.btn');
            const result = document.getElementById('result');
            
            if (!confirm('Are you sure you want to delete ALL orders? This cannot be undone!')) {
                return;
            }
            
            btn.disabled = true;
            btn.textContent = 'Deleting...';
            result.className = 'result';
            result.style.display = 'none';
            
            try {
                const response = await fetch('/admin/cleanup-orders', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                if (response.ok) {
                    const message = await response.text();
                    result.className = 'result success';
                    result.textContent = '✓ ' + message;
                } else {
                    throw new Error('Failed to delete orders');
                }
            } catch (error) {
                result.className = 'result error';
                result.textContent = '✗ Error: ' + error.message;
            } finally {
                btn.disabled = false;
                btn.textContent = 'Delete All Orders';
            }
        }
    </script>
</body>
</html>
