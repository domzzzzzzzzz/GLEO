<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="'Policies · ' + ${event.name}">Policies</title>
  <link href="/css/tailwind.css" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      min-height: 100vh;
      padding: 48px 18px;
    }
    .layout {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: white;
    }
    .page-header h2 {
      margin: 0;
      font-size: 2.2rem;
      font-weight: 800;
    }
    .card {
      background: white;
      border-radius: 28px;
      box-shadow: 0 30px 60px rgba(15,23,42,0.2);
      padding: 28px;
    }
    .tier-card {
      border-radius: 32px;
      padding: 34px;
      background: white;
      box-shadow: 0 25px 60px rgba(15,23,42,0.18);
    }
    .tier-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 16px;
    }
    .tier-pill {
      padding: 6px 16px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      background: rgba(250,204,21,0.2);
      color: #b45309;
    }
    .radio-stack {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .radio-card {
      border: 2px solid #e2e8f0;
      border-radius: 16px;
      padding: 18px;
      display: flex;
      gap: 12px;
      cursor: pointer;
      transition: all 0.3s;
      align-items: flex-start;
    }
    .radio-card.active {
      border-color: #6366f1;
      background: linear-gradient(135deg, rgba(99,102,241,0.12), rgba(129,140,248,0.12));
      box-shadow: 0 12px 35px rgba(99,102,241,0.2);
    }
    .limit-box {
      margin-top: 18px;
      border: 1px dashed #cbd5f5;
      border-radius: 16px;
      padding: 16px;
      background: #f8fafc;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .limit-box.disabled {
      opacity: 0.35;
      pointer-events: none;
    }
    .advanced-section {
      margin-top: 24px;
      border-top: 1px solid #e2e8f0;
      padding-top: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .checkbox-row {
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }
    .category-limits {
      border: 1px solid #e2e8f0;
      border-radius: 18px;
      padding: 16px;
      background: #f1f5f9;
    }
    .vendor-block {
      border: 1px dashed #cbd5f5;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .vendor-name {
      font-weight: 600;
      color: #4338ca;
      margin-bottom: 6px;
    }
    .category-row {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 6px;
    }
    .category-row span { flex: 1; }
    .category-row input {
      width: 80px;
      border: 1px solid #cbd5f5;
      border-radius: 10px;
      padding: 6px 8px;
    }
  </style>
</head>
<body>
<div class="layout">
  <div class="page-header">
    <div>
      <h2>Event Policies</h2>
      <p th:text="'Configure comprehensive rules for ' + ${event.name}">Description</p>
    </div>
    <a class="btn btn-muted" th:href="@{/admin/events}">&larr; Back to dashboard</a>
  </div>

  <div th:if="${toastMessage}" class="toast toast-success" th:text="${toastMessage}">Saved</div>
  <div th:if="${toastError}" class="toast toast-error" th:text="${toastError}">Error</div>

  <div class="card">
    <h3 style="margin-top:0;">Checkout behaviour</h3>
    <form th:action="@{|/admin/events/${event.code}/policy|}" method="post" class="policy-form" style="display:flex;flex-direction:column;gap:12px;margin-top:16px;">
      <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <label class="policy-toggle">
        <input type="checkbox" name="enableGuestPickupConfirm" th:checked="${event.enableGuestPickupConfirm}">
        <span><strong>Guest pickup confirmation</strong><small>Allow guests to mark orders as collected.</small></span>
      </label>
      <label class="policy-toggle">
        <input type="checkbox" name="requireVendorPinForPickup" th:checked="${event.requireVendorPinForPickup}">
        <span><strong>Require vendor PIN</strong><small>Vendors must enter their PIN to confirm pickup.</small></span>
      </label>
      <label class="policy-toggle">
        <input type="checkbox" name="enableMultiVendorCart" th:checked="${event.enableMultiVendorCart}">
        <span><strong>Multi-vendor cart</strong><small>Allow mixing vendors within one checkout.</small></span>
      </label>
      <label class="policy-toggle">
        <input type="checkbox" name="blockAddWhenOpenOrder" th:checked="${event.blockAddWhenOpenOrder}">
        <span><strong>Block when open order exists</strong><small>Stops guests from adding items until open orders are completed.</small></span>
      </label>
      <label class="policy-toggle">
        <input type="checkbox" name="regularOneItemPerVendor" th:checked="${event.regularOneItemPerVendor}">
        <span><strong>Legacy regular limit</strong><small>Keep “one item per vendor” for regular tier.</small></span>
      </label>
      <div style="display:flex;justify-content:flex-end;margin-top:12px;">
        <button class="btn btn-primary" type="submit">Save checkout rules</button>
      </div>
    </form>
  </div>

  <div class="tier-card" th:each="tier : ${tiers}" th:with="policy=${tierPolicies.get(tier)}">
    <form th:action="@{|/admin/events/${event.code}/tier-policy|}" method="post" th:id="'form-' + ${tier.name()}">
      <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <input type="hidden" name="tierCode" th:value="${tier}">
      <div class="tier-header">
        <div>
          <h3 style="margin:0;font-size:1.6rem;" th:text="${tier.name()} + ' tier'">VIP tier</h3>
          <small style="color:#64748b;">Access Mode</small>
        </div>
        <span class="tier-pill" th:text="${tier.name() == 'VIP' ? 'PREMIUM' : 'STANDARD'}">PREMIUM</span>
      </div>

      <div class="radio-stack">
        <label class="radio-card" th:classappend="${policy == null or policy.unlimited} ? 'active' : ''">
          <input type="radio" name="accessMode" value="unlimited"
                 th:checked="${policy == null or policy.unlimited}">
          <div>
            <strong>Unlimited access</strong>
            <p class="muted">Guests can order from all vendors without restrictions.</p>
          </div>
        </label>
        <label class="radio-card" th:classappend="${policy != null and !policy.unlimited} ? 'active' : ''">
          <input type="radio" name="accessMode" value="customize"
                 th:checked="${policy != null and !policy.unlimited}">
          <div>
            <strong>Customize limits</strong>
            <p class="muted">Set precise limits per vendor or category.</p>
          </div>
        </label>

        <div class="limit-box" th:classappend="${policy == null or policy.unlimited} ? 'disabled' : ''">
          <label>Maximum items per vendor</label>
          <input type="number" name="maxItemsPerVendor" min="1"
                 th:disabled="${policy == null or policy.unlimited}"
                 th:value="${policy != null && policy.maxItemsPerVendor != null ? policy.maxItemsPerVendor : 1}">
        </div>

        <div class="advanced-section" th:classappend="${policy == null or policy.unlimited} ? 'hidden' : ''">
          <div class="checkbox-row">
            <input type="checkbox" id="oneVendorOnly-[[${tier.name()}]]" name="oneVendorOnly"
                   th:checked="${policy != null and policy.oneVendorOnly}">
            <label for="oneVendorOnly-[[${tier.name()}]]">Lock this ticket to the first vendor it orders from.</label>
          </div>
          <div class="checkbox-row">
            <input type="checkbox" id="oneCategory-[[${tier.name()}]]" name="oneItemPerCategory"
                   th:checked="${policy != null and policy.oneItemPerCategory}">
            <label for="oneCategory-[[${tier.name()}]]">Restrict to one item per category.</label>
          </div>

          <div class="category-limits"
               th:classappend="${policy == null or !policy.oneItemPerCategory} ? 'hidden' : ''">
            <p style="margin:0 0 8px;font-weight:600;">Category limits per vendor</p>
            <div th:if="${#lists.isEmpty(vendorCategoryData)}" class="muted">
              No vendor categories available yet. Add menu items with categories first.
            </div>
            <div th:each="vendorData : ${vendorCategoryData}" class="vendor-block">
              <div class="vendor-name" th:text="${vendorData.vendorName}">Vendor</div>
              <div th:each="category : ${vendorData.categories}" class="category-row">
                <span th:text="${category}">Category</span>
                <input type="number" min="0" max="99"
                       th:name="'categoryLimit_' + ${category}"
                       th:value="${policy != null ? policy.categoryLimits.get(category) : 1}">
              </div>
            </div>
          </div>
        </div>
      </div>

      <div style="margin-top:24px;display:flex;justify-content:flex-end;">
        <button class="btn btn-primary" type="submit">Save tier policy</button>
      </div>
    </form>
  </div>
</div>

<script>
  document.querySelectorAll('.radio-stack').forEach(stack => {
    const cards = stack.querySelectorAll('.radio-card');
    const radios = stack.querySelectorAll('input[type="radio"]');
    const limitBox = stack.querySelector('.limit-box');
    const advanced = stack.querySelector('.advanced-section');
    const categoryToggle = stack.querySelector('input[name="oneItemPerCategory"]');
    const categoryPanel = stack.querySelector('.category-limits');

    function refresh() {
      cards.forEach(card => card.classList.remove('active'));
      const active = Array.from(radios).find(r => r.checked);
      if (active) {
        active.closest('.radio-card').classList.add('active');
      }
      const limited = active && active.value === 'customize';
      limitBox.classList.toggle('disabled', !limited);
      limitBox.querySelector('input').disabled = !limited;
      advanced.classList.toggle('hidden', !limited);
      if (!limited) {
        categoryPanel.classList.add('hidden');
      } else if (categoryToggle) {
        categoryPanel.classList.toggle('hidden', !categoryToggle.checked);
      }
    }

    radios.forEach(r => r.addEventListener('change', refresh));
    if (categoryToggle) {
      categoryToggle.addEventListener('change', () => {
        categoryPanel.classList.toggle('hidden', !categoryToggle.checked);
      });
    }
    refresh();
  });
</script>
</body>
</html>
