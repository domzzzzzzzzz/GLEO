<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${statusCode} + ' • ' + ${title}">500 • Error</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #312e81 100%);
      color: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
    }
    .shell {
      width: min(700px, 100%);
      background: rgba(15,23,42,0.75);
      border-radius: 32px;
      padding: 48px;
      box-shadow: 0 40px 80px rgba(2,6,23,0.6);
      position: relative;
      overflow: hidden;
    }
    .shell::after {
      content: "";
      position: absolute;
      width: 160px;
      height: 160px;
      border-radius: 50%;
      background: rgba(16,185,129,0.25);
      top: -60px;
      right: -40px;
      filter: blur(20px);
    }
    .code {
      font-size: clamp(2.6rem, 7vw, 4rem);
      font-weight: 700;
      margin: 0;
    }
    .code span {
      color: #34d399;
    }
    h2 {
      margin: 18px 0 8px;
      font-size: 1.8rem;
    }
    p {
      margin: 0 0 24px;
      color: #cbd5f5;
      line-height: 1.7;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }
    .pill {
      background: rgba(255,255,255,0.05);
      border-radius: 16px;
      padding: 14px 18px;
      font-size: 0.9rem;
    }
    .pill span {
      display: block;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #94a3b8;
    }
    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }
    .btn {
      flex: 1;
      min-width: 180px;
      padding: 14px 20px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.2);
      text-decoration: none;
      text-align: center;
      font-weight: 600;
      color: #e2e8f0;
      transition: transform 0.2s ease;
    }
    .btn.primary {
      background: linear-gradient(135deg, #10b981, #34d399);
      color: #0f172a;
      border: none;
      box-shadow: 0 20px 45px rgba(16,185,129,0.35);
    }
    .btn:hover {
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
<section class="shell">
  <p class="code"><span th:text="${statusCode}">500</span> — <span th:text="${statusText}">Server Error</span></p>
  <h2 th:text="${title}">Unexpected error</h2>
  <p th:text="${message}">Something went wrong on our side. Our team has been notified.</p>
  <div class="grid">
    <div class="pill">
      <span>Path</span>
      <strong th:text="${path}">/</strong>
    </div>
    <div class="pill">
      <span>Timestamp</span>
      <strong th:text="${timestamp}">now</strong>
    </div>
  </div>
  <div class="btn-row">
    <a class="btn primary" href="/" aria-label="Go to homepage">Return home</a>
    <a class="btn" href="mailto:support@gleo.app" aria-label="Contact support">Contact support</a>
  </div>
</section>
</body>
</html>
