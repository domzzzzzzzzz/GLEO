<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="'Vendors · ' + ${event.name}">Vendors</title>
  <link href="/css/tailwind.css" rel="stylesheet">
  <link href="/css/modern.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 2rem 1rem;
    }
    .container {
      max-width: 1400px;
      margin: 0 auto;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
    }
    .header-content h1 {
      font-size: 2rem;
      font-weight: 700;
      color: white;
      margin-bottom: 0.5rem;
    }
    .header-content p {
      color: rgba(255,255,255,0.85);
      font-size: 1rem;
    }
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      background: rgba(255,255,255,0.2);
      backdrop-filter: blur(10px);
      color: white;
      text-decoration: none;
      border-radius: 12px;
      font-weight: 600;
      transition: all 0.2s;
      border: 1px solid rgba(255,255,255,0.3);
    }
    .back-btn:hover {
      background: rgba(255,255,255,0.3);
      transform: translateY(-2px);
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1.5rem;
      margin-bottom: 2rem;
    }
    .stat-card {
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 16px;
      padding: 1.5rem;
      color: white;
    }
    .stat-label {
      font-size: 0.9rem;
      opacity: 0.9;
      margin-bottom: 0.5rem;
    }
    .stat-value {
      font-size: 2rem;
      font-weight: 700;
    }
    .card {
      background: white;
      border-radius: 20px;
      padding: 2rem;
      box-shadow: 0 20px 60px rgba(0,0,0,0.15);
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
    }
    .card-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: #1e293b;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      border: none;
      text-decoration: none;
      font-size: 0.95rem;
    }
    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
    }
    .vendors-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
    }
    .vendor-card {
      border: 2px solid #e2e8f0;
      border-radius: 16px;
      padding: 1.5rem;
      transition: all 0.2s;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .vendor-card:hover {
      border-color: #cbd5e1;
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
      transform: translateY(-2px);
    }
    .vendor-image {
      width: 100%;
      height: 180px;
      border-radius: 12px;
      object-fit: cover;
      background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
    }
    .vendor-name {
      font-size: 1.25rem;
      font-weight: 700;
      color: #1e293b;
    }
    .vendor-info {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      color: #64748b;
      font-size: 0.9rem;
    }
    .vendor-status {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.85rem;
    }
    .status-active {
      background: #dcfce7;
      color: #166534;
    }
    .status-inactive {
      background: #fee2e2;
      color: #991b1b;
    }
    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
      color: #64748b;
    }
    .empty-icon {
      font-size: 4rem;
      margin-bottom: 1rem;
    }
    .toast {
      position: fixed;
      top: 2rem;
      right: 2rem;
      padding: 1rem 1.5rem;
      border-radius: 12px;
      font-weight: 500;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      z-index: 1000;
      animation: slideIn 0.3s ease;
    }
    @keyframes slideIn {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    .toast-success {
      background: #10b981;
      color: white;
    }
    .toast-error {
      background: #ef4444;
      color: white;
    }
  </style>
</head>
<body>
<div class="container">
  <!-- Header -->
  <div class="header">
    <div class="header-content">
      <h1>Vendor Management</h1>
      <p th:text="'Manage vendors for ' + ${event.name}">Manage event vendors</p>
    </div>
    <a th:href="@{/dashboard}" class="back-btn">
      <svg width="20" height="20" viewBox="0 0 16 16" fill="currentColor">
        <path fill-rule="evenodd" d="M11.354 1.646a.5.5 0 0 1 0 .708L5.707 8l5.647 5.646a.5.5 0 0 1-.708.708l-6-6a.5.5 0 0 1 0-.708l6-6a.5.5 0 0 1 .708 0z"/>
      </svg>
      Back to Dashboard
    </a>
  </div>

  <!-- Toast Messages -->
  <div th:if="${toastMessage}" class="toast toast-success" th:text="${toastMessage}">Success</div>
  <div th:if="${toastError}" class="toast toast-error" th:text="${toastError}">Error</div>

  <!-- Stats -->
  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-label">Total Vendors</div>
      <div class="stat-value" th:text="${vendors != null ? vendors.size() : 0}">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Active Vendors</div>
      <div class="stat-value" th:text="${vendors != null ? #lists.size(vendors) : 0}">0</div>
    </div>
  </div>

  <!-- Main Card -->
  <div class="card">
    <div class="card-header">
      <h2 class="card-title">Vendors</h2>
      <a th:href="@{/dashboard}" class="btn btn-primary">
        <svg width="20" height="20" viewBox="0 0 16 16" fill="currentColor">
          <path d="M8 4a.5.5 0 0 1 .5.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3A.5.5 0 0 1 8 4z"/>
        </svg>
        Add Vendor
      </a>
    </div>

    <!-- Vendors Grid -->
    <div th:if="${vendors != null && !vendors.isEmpty()}" class="vendors-grid">
      <div th:each="vendor : ${vendors}" class="vendor-card">
        <img th:if="${vendor.imagePath != null}" 
             th:src="@{${vendor.imagePath}}" 
             th:alt="${vendor.name}"
             class="vendor-image">
        <div th:if="${vendor.imagePath == null}" class="vendor-image" 
             style="display: flex; align-items: center; justify-content: center; font-size: 3rem;">
          🏪
        </div>
        
        <div>
          <h3 class="vendor-name" th:text="${vendor.name}">Vendor Name</h3>
          <div class="vendor-info">
            <span th:if="${vendor.pinPlain != null}">
              🔐 PIN: <span style="font-family: monospace; font-weight: 600;" th:text="${vendor.pinPlain}">****</span>
            </span>
            <span th:class="${vendor.active ? 'vendor-status status-active' : 'vendor-status status-inactive'}">
              <span th:text="${vendor.active ? '● Active' : '○ Inactive'}">Status</span>
            </span>
          </div>
        </div>
      </div>
    </div>

    <!-- Empty State -->
    <div th:if="${vendors == null || vendors.isEmpty()}" class="empty-state">
      <div class="empty-icon">🏪</div>
      <div style="font-weight: 600; font-size: 1.125rem; color: #1e293b; margin-bottom: 8px;">No vendors yet</div>
      <div style="font-size: 0.9375rem;">Add your first vendor to get started</div>
    </div>
  </div>
</div>

<script>
// Auto-hide toast after 3 seconds
setTimeout(() => {
  const toasts = document.querySelectorAll('.toast');
  toasts.forEach(toast => {
    toast.style.animation = 'slideIn 0.3s ease reverse';
    setTimeout(() => toast.remove(), 300);
  });
}, 3000);
</script>
</body>
</html>
