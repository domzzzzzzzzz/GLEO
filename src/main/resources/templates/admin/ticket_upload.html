<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title th:text="'Tickets · ' + ${event.name}">Ticket Management</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      padding: 24px 20px;
    }
    
    .container {
      max-width: 1000px;
      margin: 0 auto;
    }
    
    /* Header */
    .header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
    }
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: rgba(255,255,255,0.2);
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 8px;
      color: white;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.875rem;
      transition: all 0.2s;
    }
    .back-btn:hover {
      background: rgba(255,255,255,0.3);
    }
    .page-title {
      font-size: 1.75rem;
      font-weight: 700;
      color: white;
      flex: 1;
    }
    
    /* Toast */
    .toast {
      padding: 14px 20px;
      border-radius: 12px;
      font-weight: 600;
      margin-bottom: 20px;
      font-size: 0.9375rem;
    }
    .toast-success {
      background: rgba(34,197,94,0.15);
      color: #166534;
      border: 1px solid rgba(34,197,94,0.3);
    }
    .toast-error {
      background: rgba(248,113,113,0.15);
      color: #991b1b;
      border: 1px solid rgba(248,113,113,0.3);
    }
    
    /* Cards */
    .card {
      background: white;
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      margin-bottom: 24px;
    }
    .card-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 8px;
    }
    .card-desc {
      font-size: 0.9375rem;
      color: #64748b;
      margin-bottom: 24px;
    }
    
    /* Form Elements */
    .form-group {
      margin-bottom: 20px;
    }
    .form-label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      color: #475569;
      margin-bottom: 8px;
    }
    .form-input,
    .form-select,
    .form-textarea {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e5e7eb;
      border-radius: 10px;
      font-size: 0.9375rem;
      font-family: inherit;
      transition: all 0.2s;
    }
    .form-input:focus,
    .form-select:focus,
    .form-textarea:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
    }
    .form-textarea {
      min-height: 160px;
      resize: vertical;
      font-family: 'Courier New', monospace;
      line-height: 1.6;
    }
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 16px;
    }
    
    /* Buttons */
    .btn {
      padding: 12px 24px;
      border-radius: 10px;
      font-size: 0.9375rem;
      font-weight: 600;
      border: none;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-primary {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      box-shadow: 0 4px 12px rgba(102,126,234,0.3);
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102,126,234,0.4);
    }
    .btn-primary:active {
      transform: translateY(0);
    }
    .btn-secondary {
      background: #f8fafc;
      color: #64748b;
      border: 2px solid #e5e7eb;
    }
    .btn-secondary:hover {
      background: #e5e7eb;
      color: #475569;
    }
    .btn-full {
      width: 100%;
    }
    
    /* Search Section */
    .search-box {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }
    .search-input {
      flex: 1;
      padding: 12px 16px;
      border: 2px solid #e5e7eb;
      border-radius: 10px;
      font-size: 0.9375rem;
      font-family: inherit;
    }
    .search-input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
    }
    
    /* Results */
    .result-card {
      background: #f8fafc;
      border-radius: 12px;
      padding: 20px;
      margin-top: 16px;
      display: none;
    }
    .result-card.show {
      display: block;
    }
    .result-label {
      font-size: 0.8125rem;
      color: #64748b;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
    }
    .result-value {
      font-size: 1rem;
      color: #1e293b;
      font-weight: 600;
      margin-bottom: 12px;
    }
    .result-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 0.8125rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .badge-active {
      background: #dcfce7;
      color: #166534;
    }
    .badge-inactive {
      background: #fee2e2;
      color: #991b1b;
    }
    .badge-vip {
      background: #fef3c7;
      color: #92400e;
    }
    .badge-reg {
      background: #dbeafe;
      color: #1e40af;
    }
    
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #64748b;
    }
    .error-state {
      text-align: center;
      padding: 40px 20px;
      color: #dc2626;
      background: #fee2e2;
      border-radius: 12px;
      margin-top: 16px;
      display: none;
    }
    .error-state.show {
      display: block;
    }
    
    @media (max-width: 768px) {
      body {
        padding: 16px;
      }
      .card {
        padding: 20px;
      }
      .form-grid {
        grid-template-columns: 1fr;
      }
      .page-title {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>
<div class="container">
  <!-- Header -->
  <div class="header">
    <a th:href="@{/dashboard}" class="back-btn">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
        <path fill-rule="evenodd" d="M11.354 1.646a.5.5 0 0 1 0 .708L5.707 8l5.647 5.646a.5.5 0 0 1-.708.708l-6-6a.5.5 0 0 1 0-.708l6-6a.5.5 0 0 1 .708 0z"/>
      </svg>
      Back
    </a>
    <h1 class="page-title" th:text="'Tickets · ' + ${event.name}">Tickets</h1>
  </div>

  <!-- Toast Messages -->
  <div th:if="${toastMessage}" class="toast toast-success" th:text="${toastMessage}"></div>
  <div th:if="${toastError}" class="toast toast-error" th:text="${toastError}"></div>

  <!-- Search Ticket -->
  <div class="card">
    <h2 class="card-title">🔍 Search Ticket</h2>
    <p class="card-desc">Find ticket by QR code or ID</p>
    
    <div class="search-box">
      <input type="text" id="ticketSearch" class="search-input" placeholder="Enter ticket QR code or ID...">
      <button type="button" class="btn btn-secondary" onclick="searchTicket()">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
          <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0z"/>
        </svg>
        Search
      </button>
    </div>

    <div id="searchResult" class="result-card">
      <div class="result-label">QR Code</div>
      <div class="result-value" id="resultQR">-</div>
      
      <div class="result-label">Holder Name</div>
      <div class="result-value" id="resultHolder">-</div>
      
      <div class="result-label">Tier</div>
      <div id="resultTier">-</div>
      
      <div class="result-label" style="margin-top: 12px;">Status</div>
      <div id="resultStatus">-</div>
    </div>

    <div id="errorResult" class="error-state">
      <svg width="48" height="48" viewBox="0 0 16 16" fill="currentColor" style="opacity: 0.5; margin-bottom: 12px;">
        <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14zm0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16z"/>
        <path d="M7.002 11a1 1 0 1 1 2 0 1 1 0 0 1-2 0zM7.1 4.995a.905.905 0 1 1 1.8 0l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 4.995z"/>
      </svg>
      <div style="font-weight: 600; margin-bottom: 4px;">Ticket not found</div>
      <div style="font-size: 0.875rem; opacity: 0.7;">Please check the QR code or ID and try again</div>
    </div>
  </div>

  <!-- Add New Tickets -->
  <div class="card">
    <h2 class="card-title">➕ Add New Tickets</h2>
    <p class="card-desc">Paste QR codes or upload QR code images</p>
    
    <!-- Upload QR Image -->
    <div class="upload-section" style="margin-bottom: 24px; padding: 20px; background: #f8fafc; border-radius: 12px; border: 2px dashed #e5e7eb;">
      <div style="display: flex; align-items: center; gap: 16px; margin-bottom: 12px;">
        <svg width="24" height="24" viewBox="0 0 16 16" fill="currentColor" style="color: #667eea;">
          <path d="M.5 9.9a.5.5 0 0 1 .5.5v2.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.5a.5.5 0 0 1 1 0v2.5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2v-2.5a.5.5 0 0 1 .5-.5z"/>
          <path d="M7.646 1.146a.5.5 0 0 1 .708 0l3 3a.5.5 0 0 1-.708.708L8.5 2.707V11.5a.5.5 0 0 1-1 0V2.707L5.354 4.854a.5.5 0 1 1-.708-.708l3-3z"/>
        </svg>
        <div>
          <div style="font-weight: 600; color: #1e293b; margin-bottom: 4px;">Upload QR Code Image</div>
          <div style="font-size: 0.875rem; color: #64748b;">Supports JPG, PNG (max 5MB)</div>
        </div>
      </div>
      <input type="file" id="qrImageUpload" accept="image/*" style="display: none;">
      <button type="button" class="btn btn-secondary" style="width: 100%;" onclick="document.getElementById('qrImageUpload').click()">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
          <path d="M4.406 1.342A5.53 5.53 0 0 1 8 0c2.69 0 4.923 2 5.166 4.579C14.758 4.804 16 6.137 16 7.773 16 9.569 14.502 11 12.687 11H10a.5.5 0 0 1 0-1h2.688C13.979 10 15 8.988 15 7.773c0-1.216-1.02-2.228-2.313-2.228h-.5v-.5C12.188 2.825 10.328 1 8 1a4.53 4.53 0 0 0-2.941 1.1c-.757.652-1.153 1.438-1.153 2.055v.448l-.445.049C2.064 4.805 1 5.952 1 7.318 1 8.785 2.23 10 3.781 10H6a.5.5 0 0 1 0 1H3.781C1.708 11 0 9.366 0 7.318c0-1.763 1.266-3.223 2.942-3.593.143-.863.698-1.723 1.464-2.383z"/>
          <path d="M7.646 4.146a.5.5 0 0 1 .708 0l3 3a.5.5 0 0 1-.708.708L8.5 5.707V14.5a.5.5 0 0 1-1 0V5.707L5.354 7.854a.5.5 0 1 1-.708-.708l3-3z"/>
        </svg>
        Choose Image
      </button>
      <div id="imagePreview" style="margin-top: 16px; display: none;">
        <img id="previewImg" style="max-width: 200px; max-height: 200px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
        <div id="scanResult" style="margin-top: 12px; padding: 12px; background: white; border-radius: 8px; font-family: monospace; font-size: 0.875rem; color: #1e293b;"></div>
      </div>
    </div>

    <div style="text-align: center; color: #94a3b8; font-size: 0.875rem; margin-bottom: 20px; font-weight: 600;">OR</div>
    
    <form th:action="@{|/admin/events/${event.code}/tickets|}" method="post" id="ticketForm">
      <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      
      <div class="form-group">
        <label class="form-label">QR Codes (Text)</label>
        <textarea id="qrCodesText" name="qrCodes" class="form-textarea" placeholder="QR001234567&#10;QR001234568&#10;QR001234569" required></textarea>
      </div>
      
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">Tier</label>
          <select name="tierId" class="form-select">
            <option th:each="tier : ${tiers}" th:value="${tier.id}" th:text="${tier.name}" th:selected="${tier.code == 'REG'}"></option>
          </select>
        </div>
        
        <div class="form-group">
          <label class="form-label">Holder Name (Optional)</label>
          <input type="text" name="holderName" class="form-input" placeholder="Guest name">
        </div>
      </div>
      
      <button type="submit" class="btn btn-primary btn-full">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
          <path d="M8 4a.5.5 0 0 1 .5.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3A.5.5 0 0 1 8 4z"/>
        </svg>
        Create Tickets
      </button>
    </form>
  </div>
</div>

<script>
  const eventCode = /*[[${event.code}]]*/ 'G2025';
  
  async function searchTicket() {
    const query = document.getElementById('ticketSearch').value.trim();
    if (!query) return;
    
    const resultDiv = document.getElementById('searchResult');
    const errorDiv = document.getElementById('errorResult');
    
    // Hide both initially
    resultDiv.classList.remove('show');
    errorDiv.classList.remove('show');
    
    try {
      const response = await fetch(`/api/tickets/search?q=${encodeURIComponent(query)}&eventCode=${eventCode}`);
      
      if (!response.ok) {
        throw new Error('Ticket not found');
      }
      
      const ticket = await response.json();
      
      // Populate results
      document.getElementById('resultQR').textContent = ticket.qrCode || '-';
      document.getElementById('resultHolder').textContent = ticket.holderName || 'Not assigned';
      
      // Tier badge
      const tierHtml = `<span class="result-badge badge-${ticket.tierCode.toLowerCase()}">${ticket.tierCode}</span>`;
      document.getElementById('resultTier').innerHTML = tierHtml;
      
      // Status badge
      const statusHtml = `<span class="result-badge badge-${ticket.active ? 'active' : 'inactive'}">${ticket.active ? 'Active' : 'Inactive'}</span>`;
      document.getElementById('resultStatus').innerHTML = statusHtml;
      
      resultDiv.classList.add('show');
    } catch (error) {
      errorDiv.classList.add('show');
    }
  }
  
  // Search on Enter key
  document.getElementById('ticketSearch').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
      searchTicket();
    }
  });
  
  // QR Code Image Upload with jsQR
  const qrImageUpload = document.getElementById('qrImageUpload');
  const imagePreview = document.getElementById('imagePreview');
  const previewImg = document.getElementById('previewImg');
  const scanResult = document.getElementById('scanResult');
  const qrCodesText = document.getElementById('qrCodesText');
  
  qrImageUpload.addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;
    
    const reader = new FileReader();
    reader.onload = function(event) {
      previewImg.src = event.target.result;
      imagePreview.style.display = 'block';
      
      // Create image element to process
      const img = new Image();
      img.onload = function() {
        // Create canvas to read image data
        const canvas = document.createElement('canvas');
        const context = canvas.getContext('2d');
        canvas.width = img.width;
        canvas.height = img.height;
        context.drawImage(img, 0, 0);
        
        const imageData = context.getImageData(0, 0, canvas.width, canvas.height);
        
        // Use jsQR library to decode QR code
        const code = jsQR(imageData.data, imageData.width, imageData.height, {
          inversionAttempts: "dontInvert",
        });
        
        if (code) {
          scanResult.innerHTML = '<strong style="color: #16a34a;">✓ QR Code Detected:</strong><br>' + code.data;
          // Add to textarea
          const currentText = qrCodesText.value.trim();
          qrCodesText.value = currentText ? currentText + '\n' + code.data : code.data;
        } else {
          scanResult.innerHTML = '<strong style="color: #dc2626;">✗ No QR Code Found</strong><br>Please try a clearer image';
        }
      };
      img.src = event.target.result;
    };
    reader.readAsDataURL(file);
  });
</script>

<!-- jsQR Library for QR Code Scanning -->
<script src="/js/jsQR.min.js"></script>

</body>
</html>
